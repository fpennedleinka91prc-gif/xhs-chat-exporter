name: Build & Package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: "同时创建 Release（仅对 tag push 有效）"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# 关键：softprops/action-gh-release 用默认 GITHUB_TOKEN 时，必须显式给 contents: write。
# 公开仓库下这个权限不会自动继承；没有它创建 Release 会 403。
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
        shell: bash

      - name: Install Playwright Chromium (bundled)
        # v2.1.0 起 Chromium 随包分发，装进项目内 browsers/ 目录
        run: |
          mkdir -p browsers
          PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/browsers" \
            python -m playwright install chromium
          ls -la browsers/
          du -sh browsers/
        shell: bash

      - name: Install create-dmg (macOS only)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Build GUI onedir (no browsers in spec)
        run: |
          pyinstaller --noconfirm --clean xhs_exporter_gui.spec
          ls -la dist/
        shell: bash

      - name: Copy Chromium into dist (post-build)
        # PyInstaller 不打包 Chromium（会炸），shell 手动拷贝。
        # 所有平台都拷一份到 XHS-Exporter/_internal/browsers/，macOS 再拷一份到 .app/Contents/Resources/browsers/
        run: |
          mkdir -p "dist/XHS-Exporter/_internal/browsers"
          cp -R browsers/* "dist/XHS-Exporter/_internal/browsers/"
          if [ "${{ runner.os }}" = "macOS" ] && [ -d "dist/小红书聊天记录导出.app" ]; then
            mkdir -p "dist/小红书聊天记录导出.app/Contents/Resources/browsers"
            cp -R browsers/* "dist/小红书聊天记录导出.app/Contents/Resources/browsers/"
          fi
          du -sh dist/XHS-Exporter/
          if [ -d "dist/小红书聊天记录导出.app" ]; then du -sh "dist/小红书聊天记录导出.app"; fi
        shell: bash

      - name: Zip artifacts
        id: zip
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            # macOS：打包 .app + 生成 DMG（如果 create-dmg 装好了）
            APP="dist/小红书聊天记录导出.app"
            if [ -d "$APP" ]; then
              zip -r "XHS-Exporter-macOS.zip" "$APP" -x "*.DS_Store"
            fi
            if command -v create-dmg >/dev/null 2>&1 && [ -d "$APP" ]; then
              rm -f "XHS-Exporter-macOS.dmg"
              create-dmg \
                --volname "小红书聊天记录导出" \
                --window-size 500 320 \
                --icon-size 100 \
                --app-drop-link 400 150 \
                "XHS-Exporter-macOS.dmg" \
                "$APP" || echo "⚠️ create-dmg 失败"
            fi
          else
            # Windows / Linux：打包 onedir 目录
            cd dist
            7z a -r "../XHS-Exporter-${{ runner.os }}.zip" XHS-Exporter || \
            tar czf "../XHS-Exporter-${{ runner.os }}.tar.gz" XHS-Exporter
            cd ..
          fi
          ls -la XHS-Exporter-*.zip XHS-Exporter-*.dmg 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XHS-Exporter-${{ matrix.os }}
          path: |
            XHS-Exporter-*.zip
            XHS-Exporter-*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Create Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: XHS Exporter ${{ github.ref_name }}
          body: |
            ## 小红书聊天记录导出 v2 ${{ github.ref_name }}

            🎉 **v2.1.0+ 下载即用**：Chromium 浏览器内核已随包打包，无需安装 Python / Playwright。

            每个压缩包的内容：
            - **macOS**（~180MB .dmg / ~350MB .zip）：`.app` 或 `.dmg`，双击即开
            - **Windows**（~150MB .zip）：解压后运行 `XHS-Exporter/XHS-Exporter.exe`

            ### 已知情况

            - macOS 首次启动可能被 Gatekeeper 拦截：右键 → 打开 → 继续；或在「系统设置 → 隐私与安全」里放行；
            - Windows Defender 可能提示未知发布者，**忽略即可**（签名证书是自签名的，v2.1.x 起在努力搞官方签名）；
            - 体积大主要因为 Chromium 内核（~550MB），**解压后会比下载的 zip 大一倍**。

            ### 使用流程

            1. 双击启动；
            2. 浏览器弹出 → 扫码登录小红书；
            3. 回到工具窗口 → 选会话 → 导出。
          files: |
            XHS-Exporter-*.zip
            XHS-Exporter-*.dmg
